{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "food-blue",
    "namespace": "assess-agile"
  },
  "spec": {
    "replicas": 3,
    "revisionHistoryLimit": 5,
    "progressDeadlineSeconds": 60,
    "strategy": {
      "type": "RollingUpdate",
      "rollingUpdate": {
        "maxSurge": 1,
        "maxUnavailable": 0
      }
    },
    "selector": {
      "matchLabels": {
        "app": "food",
        "color": "blue"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "food",
          "color": "blue"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "web",
            "image": "sriram24mis/assess-food:v1",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "containerPort": 80
              }
            ],
            "resources": {
              "requests": {
                "cpu": "20m",
                "memory": "24Mi"
              },
              "limits": {
                "cpu": "200m",
                "memory": "64Mi"
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 80
              },
              "initialDelaySeconds": 2,
              "periodSeconds": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 80
              },
              "initialDelaySeconds": 5,
              "periodSeconds": 5,
              "failureThreshold": 3
            }
          }
        ]
      }
    }
  }
}
