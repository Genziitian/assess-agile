---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "food",
    "namespace": "assess-agile"
  },
  "spec": {
    "type": "NodePort",
    "selector": {
      "app": "food",
      "color": "blue"
    },
    "ports": [
      {
        "port": 80,
        "targetPort": 80,
        "nodePort": 30018
      }
    ]
  }
